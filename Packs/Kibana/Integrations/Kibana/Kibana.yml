    name: url
    required: false
    type: 0
    additionalinfo: The Kibana server to which the integration connects. Ensure that the URL includes the correct port.
    section: Connect
  - additionalinfo: Provide Username + Password instead of API key + API ID
    display: Username for server login
    name: credentials
