category: Analytics & SIEM
sectionorder:
  - Connect
commonfields:
  id: Kibana
  version: -1
configuration:
  - display: Server URL
    name: url
    required: false
    type: 0
    additionalinfo: The Kibana server to which the integration connects. Ensure that the URL includes the correct port.
    section: Connect
  - additionalinfo: Provide Username + Password instead of API key + API ID
    display: Username for server login
    name: credentials
    type: 9
    section: Connect
    required: false
  - display: Trust any certificate (not secure)
    name: insecure
    type: 8
    section: Connect
    advanced: true
    required: false
  - display: Use system proxy settings
    name: proxy
    type: 8
    section: Connect
    advanced: true
    required: false
  - display: Request timeout (in seconds).
    name: timeout
    type: 0
    defaultvalue: '60'
    section: Connect
    advanced: true
    required: false
  - display: Incident type
    name: incidentType
    type: 13
    section: Connect
    required: false
  - display: Fetch incidents
    name: isFetch
    type: 8
    section: Collect
    required: false
description: "Interact with Kibana"
display: Kibana
name: Kibana
script:
  commands:
    - arguments:
        - description: The index in which to perform a search.
          name: index
          required: true
        - description: The string to query (in Lucene syntax).
          name: query
          predefined:
            - ''
        - description: A comma-separated list of document fields to fetch. If empty, the entire document is fetched.
          isArray: true
          name: fields
        - auto: PREDEFINED
          defaultValue: 'false'
          description: Calculates an explanation of a score for a query. For example, "value:1.6943597".
          name: explain
          predefined:
            - 'true'
            - 'false'
        - defaultValue: '0'
          description: The page number from which to start a search.
          name: page
        - defaultValue: '100'
          description: The number of documents displayed per page. Can be an integer between "1" and "10,000".
          name: size
        - description: The field by which to sort the results table. The supported result types are boolean, numeric, date, and keyword fields. Keyword fields require the doc_values parameter to be set to "true" from the Kibana server.
          name: sort-field
          predefined:
            - ''
        - auto: PREDEFINED
          defaultValue: asc
          description: The order by which to sort the results table. The results tables can only be sorted if a sort-field is defined.
          name: sort-order
          predefined:
            - asc
            - desc
        - description: Will overwrite the ‘query' arguments.
          name: query_dsl
        - description: The starting time of the time range.
          name: timestamp_range_start
        - description: The ending time of the time range.
          name: timestamp_range_end
        - description: Timestamp field name.
          defaultValue: "@timestamp"
          name: timestamp_field
      description: Get Prebuilt Rules Status
      name: eskb-get_prebuilt_rules_status
      outputs:
        - contextPath: Kibana.Search.Results._index
          description: The index to which the document belongs.
          type: String
autoUpdateDockerImage: false
fromversion: 5.0.0
defaultmapperin: Kibana - Incoming Mapper
tests:
  - Kibana_test
